<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenScript - Transcript Consistency Test</title>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #444;
            border-radius: 8px;
        }
        .test-button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .test-button:hover {
            background: #2563eb;
        }
        .transcript-display {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .test-segment {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
            border-left: 3px solid #3b82f6;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        .warning { color: #f59e0b; }
    </style>
</head>
<body>
    <h1>Transcript Consistency Test</h1>
    
    <div class="test-section">
        <h2>Test: Simulate Final Speech Results</h2>
        <p>This test simulates speech recognition final results to verify they all appear in the transcript.</p>
        <button class="test-button" onclick="simulateSpeech()">Simulate 10 Speech Results</button>
        <button class="test-button" onclick="clearTranscript()">Clear Transcript</button>
        
        <div id="transcript-display" class="transcript-display">
            <div id="test-results"></div>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Statistics</h2>
        <div id="stats">
            <p>Results Sent: <span id="sent-count">0</span></p>
            <p>Segments Displayed: <span id="displayed-count">0</span></p>
            <p>Success Rate: <span id="success-rate">0%</span></p>
        </div>
    </div>

    <script>
        let resultsSent = 0;
        let segmentsDisplayed = 0;
        
        const testSentences = [
            "Machine learning is a subset of artificial intelligence.",
            "Neural networks are inspired by the human brain.",
            "Deep learning uses multiple layers of processing.",
            "Supervised learning requires labeled training data.",
            "Unsupervised learning finds patterns without labels.",
            "Reinforcement learning learns through rewards and penalties.",
            "Natural language processing enables computers to understand text.",
            "Computer vision allows machines to interpret images.",
            "Transfer learning reuses knowledge from one task for another.",
            "Gradient descent optimizes model parameters iteratively."
        ];
        
        function log(message, type = 'info') {
            const resultsEl = document.getElementById('test-results');
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `test-segment ${type}`;
            div.innerHTML = `<strong>[${time}]</strong> ${message}`;
            resultsEl.appendChild(div);
            resultsEl.scrollTop = resultsEl.scrollHeight;
        }
        
        async function simulateSpeech() {
            log('Starting speech simulation...', 'info');
            resultsSent = 0;
            segmentsDisplayed = 0;
            
            // Check if transcript system exists
            if (!window.app || !window.app.transcriptSystem) {
                log('❌ Transcript system not found! Make sure the app is loaded.', 'error');
                return;
            }
            
            // Ensure session is started
            if (!window.app.transcriptSystem.state.sessionStarted) {
                log('Starting transcript session...', 'info');
                window.app.transcriptSystem.startSession();
                await new Promise(r => setTimeout(r, 500));
            }
            
            // Send test sentences
            for (let i = 0; i < testSentences.length; i++) {
                const sentence = testSentences[i];
                
                log(`Sending: "${sentence}"`, 'info');
                
                // Call handleFinalText directly
                window.app.transcriptSystem.handleFinalText(sentence);
                resultsSent++;
                
                // Wait a bit between sentences
                await new Promise(r => setTimeout(r, 800));
                
                // Check if segment appeared
                const segments = document.querySelectorAll('.finalized-segment');
                if (segments.length > segmentsDisplayed) {
                    segmentsDisplayed = segments.length;
                    log(`✅ Segment ${segmentsDisplayed} displayed`, 'success');
                } else {
                    log(`⚠️ Segment ${i + 1} not displayed yet`, 'warning');
                }
                
                updateStats();
            }
            
            // Final check after a delay
            setTimeout(() => {
                const finalSegments = document.querySelectorAll('.finalized-segment');
                segmentsDisplayed = finalSegments.length;
                updateStats();
                
                if (segmentsDisplayed === resultsSent) {
                    log(`✅ SUCCESS: All ${resultsSent} segments displayed!`, 'success');
                } else {
                    log(`❌ FAILURE: Only ${segmentsDisplayed} of ${resultsSent} segments displayed`, 'error');
                }
            }, 2000);
        }
        
        function clearTranscript() {
            const container = document.getElementById('finalizedSegments');
            if (container) {
                container.innerHTML = '';
                log('Transcript cleared', 'info');
            }
            
            // Clear test results
            document.getElementById('test-results').innerHTML = '';
            resultsSent = 0;
            segmentsDisplayed = 0;
            updateStats();
        }
        
        function updateStats() {
            document.getElementById('sent-count').textContent = resultsSent;
            document.getElementById('displayed-count').textContent = segmentsDisplayed;
            const rate = resultsSent > 0 ? Math.round((segmentsDisplayed / resultsSent) * 100) : 0;
            document.getElementById('success-rate').textContent = rate + '%';
            document.getElementById('success-rate').className = rate === 100 ? 'success' : rate >= 80 ? 'warning' : 'error';
        }
        
        // Auto-update stats every second
        setInterval(() => {
            const segments = document.querySelectorAll('.finalized-segment');
            if (segments.length !== segmentsDisplayed) {
                segmentsDisplayed = segments.length;
                updateStats();
            }
        }, 1000);
    </script>
</body>
</html>
